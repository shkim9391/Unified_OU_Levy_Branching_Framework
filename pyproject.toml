[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oulb-framework"
version = "0.5.0"
description = "Unified Ornstein-Uhlenbeck-Levy-Branching framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
application = [
  "anndata>=0.10",
  "h5py>=3.8",
  "matplotlib>=3.7",
]
test = [
  "pytest>=7.4",
  "matplotlib>=3.7",
]
io = [
  "openpyxl>=3.1",
  "pyarrow>=14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
